client_max_body_size 12m;
root /srv;
location = /img/legionautorent.svg {
    alias /srv/static/img/logo.svg;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location = /video/video-2.mp4 {
    alias /srv/media/legacy/video-2.mp4;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
}
location = /healthz/ {
    access_log off;
    proxy_pass http://web:8001;
    proxy_set_header Host localhost;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/static/build/assets/.*\.js$ {
    gzip off;
    types { }
    default_type application/javascript;
    try_files $uri$asset_suffix $uri =404;
    add_header Content-Encoding $asset_encoding;
    add_header Vary Accept-Encoding;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
}
location ~ ^/static/build/assets/.*\.css$ {
    gzip off;
    types { }
    default_type text/css;
    try_files $uri$asset_suffix $uri =404;
    add_header Content-Encoding $asset_encoding;
    add_header Vary Accept-Encoding;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
}
location /static/hero/ {
    try_files $uri =404;
    gzip off;
    max_ranges 1;
    add_header Cache-Control 'public, max-age=31536000, immutable';
    add_header X-Content-Type-Options nosniff always;
}
location /static/ {
    try_files $uri =404;
    gzip_static on;
    expires 30d;
    add_header X-Content-Type-Options nosniff always;
}
location /media/ {
    try_files $uri =404;
    expires 7d;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
}
location / {
    proxy_pass http://web:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 35s;
}
