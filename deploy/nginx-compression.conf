# Precompressed Vite bundles: Brotli where accepted, then gzip. Other assets use gzip_static.
map $http_accept_encoding $accept_br {
    default 0;
    "~*(^|,)\s*br\s*(,|$)" 1;
    "~*(^|,)\s*br\s*;\s*q=(1(\.0*)?|0\.[0-9]*[1-9][0-9]*)\s*(,|$)" 1;
}
map $http_accept_encoding $accept_gzip {
    default 0;
    "~*(^|,)\s*gzip\s*(,|$)" 1;
    "~*(^|,)\s*gzip\s*;\s*q=(1(\.0*)?|0\.[0-9]*[1-9][0-9]*)\s*(,|$)" 1;
}
map $accept_br$accept_gzip $asset_encoding {
    default '';
    ~^1 br;
    01 gzip;
}
map $asset_encoding $asset_suffix {
    default '';
    br .br;
    gzip .gz;
}
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 512;
gzip_types text/css application/javascript application/json application/xml image/svg+xml;
