# Staging uses its own certificate, hostname and SITE_URL; never copy this auth block to production.
server {
    listen 443 ssl;
    server_name new.legionautorent.kz;
    ssl_certificate /etc/letsencrypt/live/new.legionautorent.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.legionautorent.kz/privkey.pem;
    auth_basic "Legion staging";
    auth_basic_user_file /etc/nginx/legion-staging.htpasswd;
    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /static/ { alias /srv/legion/staticfiles/; }
    location /media/ { alias /srv/legion/media/; add_header X-Content-Type-Options nosniff always; }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
