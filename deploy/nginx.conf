server {
    listen 80;
    server_name legionautorent.kz www.legionautorent.kz;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://legionautorent.kz$request_uri; }
}
server {
    listen 443 ssl;
    server_name www.legionautorent.kz;
    ssl_certificate /etc/letsencrypt/live/legionautorent.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legionautorent.kz/privkey.pem;
    return 301 https://legionautorent.kz$request_uri;
}
server {
    listen 443 ssl;
    server_name legionautorent.kz;
    ssl_certificate /etc/letsencrypt/live/legionautorent.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legionautorent.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 12m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    location /static/ {
        alias /srv/legion/staticfiles/;
        expires 30d;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /srv/legion/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        # Serve uploads as static files only; never route them to executable handlers.
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 35s;
    }
}
