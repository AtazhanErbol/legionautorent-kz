{% load i18n legion_tags %}{% if faqs %}<section class="section faq-section" id="faq"><div class="container faq-layout"><div><p class="eyebrow">FAQ</p><h2>{% trans 'Хороший вопрос.' %}<br>{% trans 'Понятный ответ.' %}</h2><p>{% trans 'Остались вопросы? Мы на связи.' %}</p><a class="text-link" href="{{ site.whatsapp_url }}" data-event="click_whatsapp">{% trans 'Спросить в WhatsApp' %} ↗</a></div><div class="faq-list">{% for faq in faqs %}<details><summary>{{ faq|tr:'question' }}<span aria-hidden="true">+</span></summary><div class="prose">{{ faq|tr:'answer'|richtext }}</div></details>{% endfor %}</div></div></section>{% endif %}
