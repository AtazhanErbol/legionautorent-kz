services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: legion
      POSTGRES_USER: legion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legion -d legion"]
      interval: 10s
      timeout: 5s
      retries: 5
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://legion:${POSTGRES_PASSWORD}@db:5432/legion
      ENVIRONMENT: ${ENVIRONMENT:?Set staging or production}
      DEBUG: "false"
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:?Set the actual Nginx peer or Docker gateway IP}
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
