<div class="ui"><strong>LEGION / SEDAN</strong><p>Оригинальная модель · интерактивный просмотр</p><div class="buttons"><button data-view="front">Спереди</button><button data-view="side">Профиль</button><button data-view="rear">Сзади</button><button id="lights">Фары</button><button id="studio">Светлая студия</button></div></div>

<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;document.body.append(renderer.domElement);

const reflection=model.clone(true);reflection.scale.y=-1;reflection.position.y=-.04;reflection.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.material.opacity=.10;o.material.roughness=1;o.material.depthWrite=false;}});scene.add(reflection);
let on=false,bright=false;const front=[],rear=[];model.traverse(o=>{if(o.isMesh){if(o.material.name==='Headlight_Lens')front.push(o.material);if(o.material.name==='Taillight_Lens')rear.push(o.material);}});

renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)});
window.heroViewer={scene,model,renderer,camera,controls,front,rear};document.body.dataset.ready='true';
</script></html>
