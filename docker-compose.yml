name: legion
services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: legion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set an administrative PostgreSQL password}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set a separate application database password}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/10-legion.sh:ro
    networks:
      backend:
        ipv4_address: 172.30.0.30
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d legion']
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql://legion:${APP_DB_PASSWORD}@db:5432/legion
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      DEBUG: 'false'
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-legionautorent.kz,www.legionautorent.kz,localhost,127.0.0.1}
      TRUST_PROXY_HEADERS: 'true'
      TRUSTED_PROXY_IPS: 172.30.0.10
      FORWARDED_ALLOW_IPS: 172.30.0.10
      BOOTSTRAP_LEGACY: ${BOOTSTRAP_LEGACY:-true}
      DOWNLOAD_LEGACY_IMAGES: ${DOWNLOAD_LEGACY_IMAGES:-true}
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ./backups:/app/backups
    networks:
      backend:
        ipv4_address: 172.30.0.20
    depends_on:
      db:
        condition: service_healthy
  nginx:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ${NGINX_CONFIG:-./deploy/nginx-bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx-compression.conf:/etc/nginx/conf.d/10-compression.conf:ro
      - ./deploy/nginx-shared.conf:/etc/nginx/legion/shared.conf:ro
      - media:/srv/media:ro
      - staticfiles:/srv/static:ro
      - acme:/var/www/acme:ro
      - certificates:/etc/letsencrypt:ro
    networks:
      backend:
        ipv4_address: 172.30.0.10
    depends_on:
      web:
        condition: service_healthy
  certbot:
    image: certbot/certbot:latest
    profiles: [certificate]
    volumes:
      - acme:/var/www/acme
      - certificates:/etc/letsencrypt
volumes:
  pgdata:
  media:
  staticfiles:
  acme:
  certificates:
networks:
  backend:
    ipam:
      config:
        - subnet: 172.30.0.0/24
